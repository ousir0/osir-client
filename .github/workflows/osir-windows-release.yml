name: OSIR Windows x64 and Intel Mac build (manual artifacts)

on:
  workflow_dispatch:
    inputs:
      updater_platform:
        type: choice
        default: both
        options: [both, windows, macos]
        required: false
      updater_only:
        type: boolean
        default: false
        required: false
      probe_only:
        type: boolean
        default: false
        required: false
      version:
        type: string
        required: false
      windows_executable_sha256:
        type: string
        required: false
      intel_executable_sha256:
        type: string
        required: false
      channel:
        description: OSIR channel; artifacts require local finalization before publication
        required: true
        default: prod
        type: choice
        options: [prod, beta]
      source_sha256:
        description: Exact sourceSha256 from the final private source snapshot
        required: true
        type: string
      include_mac_intel:
        description: Also build the Intel macOS application for local signing
        required: true
        default: true
        type: boolean
      backup_preflight_only:
        description: Run only the fast native Windows path and ACL gate
        required: true
        default: false
        type: boolean
      acceptance_only:
        description: Re-run acceptance against an existing Windows package without building
        required: false
        default: false
        type: boolean
      source_run:
        description: Existing build run ID, required for acceptance-only mode
        required: false
        type: string
      source_head:
        description: Existing frozen source commit, required for acceptance-only mode
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: osir-platform-builds-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-backup-preflight:
    name: Fast native Windows backup path and ACL gate
    if: ${{ !inputs.acceptance_only && !inputs.updater_only && !inputs.probe_only }}
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Preserve exact LF source bytes
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Verify frozen source identity
        shell: pwsh
        env:
          OSIR_SOURCE_SHA256: ${{ inputs.source_sha256 }}
        run: node scripts/osir-ci-artifact.mjs preflight ${{ inputs.channel }} x86_64-pc-windows-msvc
      - name: Install pinned Rust
        shell: pwsh
        run: rustup toolchain install 1.95 --profile minimal
      - name: Exercise real path and ACL code before expensive application compilation
        shell: pwsh
        run: cargo +1.95 test --locked --manifest-path tests/native-windows-backup/Cargo.toml -- --test-threads=1
  windows-x64:
    needs: windows-backup-preflight
    if: ${{ !inputs.backup_preflight_only && !inputs.acceptance_only }}
    name: Windows x64 NSIS and packaged lifecycle
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    env:
      CI: "true"
      OSIR_CHANNEL: ${{ inputs.channel }}
      OSIR_SOURCE_SHA256: ${{ inputs.source_sha256 }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_RELEASE_DEBUG: "0"

    steps:
      - name: Preserve LF source bytes on Windows
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout dispatched private snapshot without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup pinned Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Verify exact source, native runner and toolchain versions
        id: versions
        run: node scripts/osir-ci-artifact.mjs preflight $env:OSIR_CHANNEL x86_64-pc-windows-msvc

      - name: Setup pinned pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: package.json
          run_install: false

      - name: Install pinned Rust and Windows x64 target
        run: |
          rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed' }
          rustup target add x86_64-pc-windows-msvc --toolchain $env:RUSTUP_TOOLCHAIN
          if ($LASTEXITCODE -ne 0) { throw 'Windows target installation failed' }

      - name: Restore pnpm download cache
        # pnpm must exist before setup-node locates its content-addressed store.
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Restore Rust dependency compilation cache
        id: rust-cache
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          prefix-key: osir-native-v1
          key: windows-2022-x64-${{ inputs.channel }}
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST ImageOS ImageVersion
          workspaces: src-tauri -> target
          cache-bin: false
          cache-workspace-crates: false
          cache-on-failure: false

      - name: Install frozen frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate unsigned Windows packaging configuration
        run: node scripts/osir-build-windows.mjs $env:OSIR_CHANNEL --check

      - name: Verify native Windows configuration backup lifecycle and ACLs
        timeout-minutes: 90
        run: |
          cargo test --release --locked --target x86_64-pc-windows-msvc --manifest-path src-tauri/Cargo.toml --lib tool_backup -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'Windows backup lifecycle tests failed' }

      - name: Verify existing Codex package discovery and installer identity fixtures
        run: |
          cargo test --release --locked --target x86_64-pc-windows-msvc --manifest-path src-tauri/Cargo.toml --lib osir_identity::tests -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'Windows startup migration tests failed' }
          cargo test --release --locked --target x86_64-pc-windows-msvc --manifest-path src-tauri/Cargo.toml --lib commands::osir_tools::windows_support::tests -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'Windows installed-tool identity tests failed' }
          cargo test --release --locked --target x86_64-pc-windows-msvc --manifest-path src-tauri/Cargo.toml --lib services::osir::windows_codex_package::tests -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'Windows Codex package identity tests failed' }

      - name: Build unsigned NSIS installer and embedded application
        timeout-minutes: 90
        run: node scripts/osir-build-windows.mjs $env:OSIR_CHANNEL

      - name: Validate pending artifacts and source provenance
        id: packaged
        run: node scripts/osir-ci-artifact.mjs windows-output $env:OSIR_CHANNEL x86_64-pc-windows-msvc

      - name: Install, open real window, reinstall using UPDATE, uninstall
        timeout-minutes: 10
        env:
          OSIR_ARTIFACT_DIRECTORY: ${{ steps.packaged.outputs.directory }}
        run: "& ./scripts/osir-windows-packaged-smoke.ps1 -ArtifactDirectory $env:OSIR_ARTIFACT_DIRECTORY"

      - name: Accept packaged lifecycle evidence
        run: node scripts/osir-ci-artifact.mjs accept-windows $env:OSIR_CHANNEL x86_64-pc-windows-msvc

      - name: Upload unsigned artifacts and lifecycle evidence
        if: always() && steps.packaged.outputs.directory != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: osir-ci-${{ steps.versions.outputs.version }}-${{ inputs.channel }}-windows-x64-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.packaged.outputs.directory }}/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload Cargo compilation timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: osir-timings-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: src-tauri/target/cargo-timings/
          if-no-files-found: warn
          retention-days: 7

  windows-acceptance-recheck:
    if: ${{ inputs.acceptance_only }}
    name: Recheck an existing Windows package without rebuilding
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      CI: "true"
      OSIR_SOURCE_SHA256: ${{ inputs.source_sha256 }}
    steps:
      - name: Preserve LF source bytes
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout acceptance harness
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: harness
          persist-credentials: false

      - name: Checkout immutable package source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: source
          ref: ${{ inputs.source_head }}
          persist-credentials: false

      - name: Setup pinned Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: source/.node-version
          package-manager-cache: false

      - name: Verify immutable source and build identity
        id: package-identity
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_run }}
          SOURCE_HEAD: ${{ inputs.source_head }}
          SOURCE_CHANNEL: ${{ inputs.channel }}
        run: |
          if ($env:SOURCE_RUN -notmatch '^\d+$' -or $env:SOURCE_HEAD -notmatch '^[a-f0-9]{40}$') { throw 'Invalid immutable build identity' }
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:SOURCE_RUN" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $run.head_sha -ne $env:SOURCE_HEAD -or $run.head_branch -ne 'codex/release-build') { throw 'Build identity mismatch' }
          $version = (Get-Content -Raw source/package.json | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$' -or $env:SOURCE_CHANNEL -notin @('prod', 'beta')) { throw 'Invalid package version/channel' }
          $artifactName = "osir-ci-$version-${env:SOURCE_CHANNEL}-windows-x64-${env:SOURCE_RUN}-$($run.run_attempt)"
          $artifact = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:SOURCE_RUN/artifacts" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or @($artifact.artifacts | Where-Object { $_.name -eq $artifactName -and -not $_.expired }).Count -ne 1) { throw 'Exact Windows artifact is missing or expired' }
          "artifact-name=$artifactName" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          $env:GITHUB_SHA = $env:SOURCE_HEAD
          node source/scripts/osir-ci-artifact.mjs preflight $env:SOURCE_CHANNEL x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Frozen source validation failed' }

      - name: Download existing unsigned Windows package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ steps.package-identity.outputs.artifact-name }}
          path: source/release/osir/recheck-input
          run-id: ${{ inputs.source_run }}
          github-token: ${{ github.token }}

      - name: Prepare a clean package acceptance directory
        run: |
          $input = "$env:GITHUB_WORKSPACE/source/release/osir/recheck-input"
          $output = "$env:GITHUB_WORKSPACE/source/release/osir/recheck"
          $manifest = Get-Content -Raw (Join-Path $input 'build-manifest.json') | ConvertFrom-Json
          New-Item -ItemType Directory -Path $output | Out-Null
          Copy-Item (Join-Path $input 'build-manifest.json') $output
          foreach ($artifact in @($manifest.installerArtifact, $manifest.mainExecutableArtifact, $manifest.compiledExecutableArtifact)) {
            if ($artifact -and $artifact.name) { Copy-Item (Join-Path $input $artifact.name) $output }
          }

      - name: Register the exact official Codex package in the ephemeral runner
        shell: powershell
        timeout-minutes: 10
        run: |
          $package = Join-Path $env:RUNNER_TEMP 'Codex-26.1027.6604.0-x64.msix'
          $url = 'https://persistent.oaistatic.com/codex-app-prod/ChatGPT-x64.msix'
          $expected = '9a4f7a1c9b6240968cc9ba40181629f1b3fa30eba5cfa2dd3f4fdd848b25ae5d'
          & curl.exe --fail --location --max-time 480 --retry 2 --output $package $url
          if ($LASTEXITCODE -ne 0) { throw 'Official Codex download failed' }
          $observedHash = (Get-FileHash $package -Algorithm SHA256).Hash.ToLowerInvariant()
          $observedSignature = Get-AuthenticodeSignature -LiteralPath $package
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead($package)
          try {
            $reader = [IO.StreamReader]::new($archive.GetEntry('AppxManifest.xml').Open())
            try { [xml]$manifest = $reader.ReadToEnd() } finally { $reader.Dispose() }
          } finally { $archive.Dispose() }
          Write-Host ([ordered]@{bytes=(Get-Item $package).Length;sha256=$observedHash;signature=[string]$observedSignature.Status;subject=[string]$observedSignature.SignerCertificate.Subject;issuer=[string]$observedSignature.SignerCertificate.Issuer;name=[string]$manifest.Package.Identity.Name;version=[string]$manifest.Package.Identity.Version} | ConvertTo-Json -Compress)
          if ((Get-Item $package).Length -ne 1003521886 -or $observedHash -ne $expected) { throw 'Codex package size/hash mismatch' }
          $sig = Get-AuthenticodeSignature -LiteralPath $package
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -ne 'CN=50BDFD77-8903-4850-9FFE-6E8522F64D5B' -or $sig.SignerCertificate.Issuer -notmatch 'Microsoft') { throw 'Official Codex signature rejected' }
          Add-AppxPackage -Path $package -ErrorAction Stop
          $installed = @(Get-AppxPackage -Name OpenAI.Codex -ErrorAction Stop)
          if ($installed.Count -ne 1 -or [string]$installed[0].Version -ne '26.1027.6604.0' -or $installed[0].PackageFamilyName -ne 'OpenAI.Codex_2p2nqsd0c76g0') { throw 'Real Codex registration was not confirmed' }
          $evidence = [ordered]@{
            schemaVersion = 1
            source = $url
            sha256 = $expected
            bytes = (Get-Item $package).Length
            signatureStatus = [string]$sig.Status
            subject = [string]$sig.SignerCertificate.Subject
            issuer = [string]$sig.SignerCertificate.Issuer
            packageName = [string]$installed[0].Name
            packageVersion = [string]$installed[0].Version
            family = [string]$installed[0].PackageFamilyName
            scope = 'registered-official-package-on-ephemeral-runner-without-launch-or-login'
          }
          [IO.File]::WriteAllText((Join-Path $env:GITHUB_WORKSPACE 'source/release/osir/recheck/windows-installed-codex-evidence.json'), ($evidence | ConvertTo-Json -Depth 4), [Text.UTF8Encoding]::new($false))

      - name: Inspect exact Windows Codex discovery in the runner
        run: |
          $text = Get-Content -Raw source/src-tauri/src/commands/osir_tools_windows_support.rs
          $match = [regex]::Match($text, '(?s)pub\(crate\) const CODEX_DISCOVERY: &str = r#"(.*?)"#;')
          if (-not $match.Success) { throw 'Windows Codex discovery script is missing' }
          $query = '$ErrorActionPreference = ''Stop''; ' + $match.Groups[1].Value
          $query = $query -replace 'ConvertTo-Json -InputObject @\(\$result\) -Depth 5 -Compress', "Write-Output ('count=' + @(`$result).Count)"
          $timer = [Diagnostics.Stopwatch]::StartNew()
          $detail = @(& "$env:SystemRoot/System32/WindowsPowerShell/v1.0/powershell.exe" -NoLogo -NoProfile -NonInteractive -Command $query 2>&1)
          $exit = $LASTEXITCODE
          $timer.Stop()
          Write-Host "Read-only AppX discovery exit=$exit elapsedMs=$($timer.ElapsedMilliseconds)"
          if ($exit -eq 0) { Write-Host ($detail -join ' '); exit 0 }
          $safe = (($detail | Select-Object -First 1 | Out-String).Trim() -replace '[A-Za-z]:\\[^ ]+', '[path]')
          Write-Host "AppX discovery diagnostic: $($safe.Substring(0, [Math]::Min(240, $safe.Length)))"

      - name: Download and verify published 0.1.3 installer for real cross-version upgrade
        timeout-minutes: 10
        run: |
          $baseline = Join-Path $env:RUNNER_TEMP 'OSIR-Client-prod-0.1.3-baseline.exe'
          & curl.exe --fail --max-time 480 --retry 2 --output $baseline 'https://osirclaw.com/api/v1/osir-client/artifacts/prod-0.1.3/OSIR-Client-prod-0.1.3-x86_64-pc-windows-msvc-setup.exe'
          if ($LASTEXITCODE -ne 0) { throw 'Published baseline download failed' }
          if ((Get-Item $baseline).Length -ne 231645062 -or (Get-FileHash $baseline -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'b409637fd7a05d1835c7190d1c7224193af2f8fcc48763fbfe1dcae2cd82b1c5') { throw 'Published baseline size/hash mismatch' }
          "OSIR_UPGRADE_BASELINE=$baseline" >> $env:GITHUB_ENV

      - name: Run installed package lifecycle and renderer checks
        env:
          OSIR_EXPECT_CODEX_VERSION: '26.1027.6604.0'
        run: |
          & ./harness/scripts/osir-windows-packaged-smoke.ps1 -ArtifactDirectory "$env:GITHUB_WORKSPACE/source/release/osir/recheck"

      - name: Restore exact source checkout and validate acceptance evidence
        env:
          SOURCE_HEAD: ${{ inputs.source_head }}
        run: |
          $env:GITHUB_SHA = $env:SOURCE_HEAD
          node --input-type=module -e "import {acceptWindowsSmoke} from './source/scripts/osir-ci-artifact.mjs'; acceptWindowsSmoke('./source/release/osir/recheck');"
          if ($LASTEXITCODE -ne 0) { throw 'Original source acceptance validation failed' }

      - name: Upload rechecked Windows package and evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: osir-rechecked-${{ steps.package-identity.outputs.version }}-windows-${{ github.run_id }}
          path: source/release/osir/recheck/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  macos-intel:
    name: Intel Mac application for local finalization
    needs: windows-backup-preflight
    if: inputs.include_mac_intel && !inputs.backup_preflight_only
    runs-on: macos-15-intel
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      CI: "true"
      OSIR_CHANNEL: ${{ inputs.channel }}
      OSIR_SOURCE_SHA256: ${{ inputs.source_sha256 }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_RELEASE_DEBUG: "0"

    steps:
      - name: Preserve LF source bytes
        run: git config --global core.autocrlf false

      - name: Checkout same dispatched private snapshot without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup pinned Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Verify exact source, native runner and toolchain versions
        id: versions
        run: node scripts/osir-ci-artifact.mjs preflight "$OSIR_CHANNEL" x86_64-apple-darwin

      - name: Setup pinned pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: package.json
          run_install: false

      - name: Install pinned Rust and Intel macOS target
        run: |
          set -euo pipefail
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustup target add x86_64-apple-darwin --toolchain "$RUSTUP_TOOLCHAIN"
          xcode-select -p
          xcrun --show-sdk-path

      - name: Restore pnpm download cache
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Restore Rust dependency compilation cache
        id: rust-cache
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          prefix-key: osir-native-v1
          key: macos-15-intel-${{ inputs.channel }}
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST ImageOS ImageVersion
          workspaces: src-tauri -> target
          cache-bin: false
          cache-workspace-crates: false
          cache-on-failure: false

      - name: Install frozen frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Intel packaging configuration
        run: node scripts/osir-build-macos-ci.mjs "$OSIR_CHANNEL" --check

      - name: Build embedded Intel application without signing credentials
        timeout-minutes: 90
        run: node scripts/osir-build-macos-ci.mjs "$OSIR_CHANNEL"

      - name: Validate Intel artifacts and source provenance
        id: packaged
        run: node scripts/osir-ci-artifact.mjs mac-output "$OSIR_CHANNEL" x86_64-apple-darwin

      - name: Launch and reopen native Intel application with isolated data
        timeout-minutes: 5
        env:
          OSIR_ARTIFACT_DIRECTORY: ${{ steps.packaged.outputs.directory }}
        run: node scripts/osir-macos-packaged-smoke.mjs "$OSIR_ARTIFACT_DIRECTORY"

      - name: Archive application preserving executable modes and symlinks
        if: always() && steps.packaged.outputs.directory != ''
        id: archive
        env:
          OSIR_ARTIFACT_DIRECTORY: ${{ steps.packaged.outputs.directory }}
        run: |
          set -euo pipefail
          archive="osir-ci-$OSIR_CHANNEL-intel-pending.tar.gz"
          tar -czf "$RUNNER_TEMP/$archive" -C "$OSIR_ARTIFACT_DIRECTORY" .
          (cd "$RUNNER_TEMP" && shasum -a 256 "$archive" > "$archive.sha256")
          echo "path=$RUNNER_TEMP/$archive" >> "$GITHUB_OUTPUT"

      - name: Upload Intel application archive for local signing
        if: always() && steps.archive.outputs.path != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: osir-ci-${{ steps.versions.outputs.version }}-${{ inputs.channel }}-macos-intel-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.archive.outputs.path }}
            ${{ steps.archive.outputs.path }}.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload Cargo compilation timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: osir-timings-intel-${{ github.run_id }}-${{ github.run_attempt }}
          path: src-tauri/target/cargo-timings/
          if-no-files-found: warn
          retention-days: 7

  windows-update:
    if: ${{ inputs.updater_only && !inputs.probe_only && inputs.updater_platform != 'macos' }}
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      CI: 'true'
      EXPECTED_VERSION: ${{ inputs.version }}
      EXPECTED_SHA: ${{ inputs.windows_executable_sha256 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Click update in the published 0.1.4 app and verify automatic restart
        shell: pwsh
        run: ./scripts/osir-live-updater-windows.ps1 -ExpectedVersion $env:EXPECTED_VERSION -ExpectedExecutableSha256 $env:EXPECTED_SHA
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: published-windows-updater-${{ github.run_id }}
          path: updater-evidence/
          if-no-files-found: error
  macos-update:
    if: ${{ inputs.updater_only && !inputs.probe_only && inputs.updater_platform != 'windows' }}
    runs-on: macos-15-intel
    timeout-minutes: 20
    env:
      CI: 'true'
      EXPECTED_VERSION: ${{ inputs.version }}
      EXPECTED_SHA: ${{ inputs.intel_executable_sha256 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Click update in the published 0.1.4 app and verify automatic restart
        run: python3 scripts/osir-live-updater-macos.py "$EXPECTED_VERSION" "$EXPECTED_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: published-macos-updater-${{ github.run_id }}
          path: updater-evidence/
          if-no-files-found: error
  macos-ui-probe:
    if: inputs.probe_only
    runs-on: macos-15-intel
    steps:
      - name: Check existing UI automation permission without changing system controls
        run: swift -e 'import ApplicationServices; print("AX_TRUSTED=\(AXIsProcessTrusted())")'
