name: OSIR isolated Windows cache ACL diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cache-acl:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Reproduce exact frozen cache ACL script via pwsh parent
        shell: pwsh
        env:
          DIAGNOSTIC_OUTPUT: ${{ runner.temp }}/cache-acl-report
        run: python diagnostics/anywhere-cache/cache_acl_diagnostic.py
      - name: Verify native Windows path semantics without dependencies
        shell: pwsh
        run: |
          @'
          fn main() { assert!(!std::path::Path::new("/fixture").is_absolute()); assert!(std::path::Path::new(r"C:\fixture").is_absolute()); println!("Windows absolute fixture distinction verified"); }
          '@ | Set-Content -Encoding utf8 "$env:RUNNER_TEMP/path-probe.rs"
          rustc "$env:RUNNER_TEMP/path-probe.rs" -o "$env:RUNNER_TEMP/path-probe.exe"
          if ($LASTEXITCODE -ne 0) { throw 'rustc failed' }
          & "$env:RUNNER_TEMP/path-probe.exe"
          if ($LASTEXITCODE -ne 0) { throw 'path probe failed' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: cache-acl-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/cache-acl-report
          retention-days: 7
