# Same already-registered workflow path, changed ONLY on the reviewed control branch.
name: OSIR r2 native ARM prod and genuine Dev
run-name: Client r2 ARM ${{ inputs.build_kind }} source ${{ inputs.source_commit }}

on:
  workflow_dispatch:
    inputs:
      build_kind:
        description: Reviewed r2 production gate or genuine isolated Dev package
        type: choice
        required: true
        default: prod
        options: [prod, dev]
      source_commit:
        description: Reviewed exact product commit (never workflow SHA)
        type: string
        required: true
        default: 8bebc7a884b51336590e0b54313f70f3f4364509
      source_sha256:
        description: Reviewed immutable product source fingerprint
        type: string
        required: true
        default: a376ca7fc36ad9546b8095276cd736b282833513f22d7bc5dce1e44d75914017

permissions:
  contents: read
concurrency:
  group: osir-r2-arm-${{ inputs.build_kind }}-${{ inputs.source_commit }}
  cancel-in-progress: false

jobs:
  macos-arm64:
    if: ${{ inputs.build_kind == 'prod' }}
    runs-on: macos-15
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      CI: 'true'
      OSIR_CHANNEL: prod
      OSIR_SOURCE_SHA256: ${{ inputs.source_sha256 }}
      OSIR_RESCUE_SOURCE_COMMIT: ${{ inputs.source_commit }}
      OSIR_RESCUE_SOURCE: ${{ github.workspace }}/source
      OSIR_RESCUE_EVIDENCE: ${{ github.workspace }}/osir-arm-rescue-evidence
      CARGO_TARGET_DIR: ${{ github.workspace }}/source/src-tauri/target
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
    steps:
      - name: Preserve frozen LF bytes
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Checkout separate dispatched control harness
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - name: Checkout exact frozen product in independent source directory
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_commit }}
          path: source
          persist-credentials: false
      - name: Setup product pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: source/.node-version
          package-manager-cache: false
      - name: Check harness tests without Cargo
        run: node --test control/scripts/osir-arm-rescue.test.mjs
      - name: Assert source HEAD and bytes, record actual producer identity
        run: node control/scripts/osir-arm-rescue.mjs init
      - name: Original source native ARM preflight (scoped compatibility input)
        id: versions
        run: node control/scripts/osir-arm-rescue.mjs source-script preflight
      - name: Setup pinned pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: source/package.json
          run_install: false
      - name: Install original pinned Rust and native target
        run: |
          set -euo pipefail
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustup target add aarch64-apple-darwin --toolchain "$RUSTUP_TOOLCHAIN"
          xcode-select -p
          xcrun --show-sdk-path
      - name: Restore pnpm download cache
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: source/.node-version
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml
      - name: Reuse dependencies and retain them on later tool failure
        id: rust-cache
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          prefix-key: osir-native-v1
          key: macos-15-arm64-prod
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST ImageOS ImageVersion
          workspaces: source/src-tauri -> target
          cache-bin: false
          cache-workspace-crates: false
          cache-on-failure: true
      - name: Install frozen frontend dependencies
        working-directory: source
        run: pnpm install --frozen-lockfile
      - name: Original release runtime check
        run: node control/scripts/osir-arm-rescue.mjs source-script check
      - name: Original four native regressions (Node log gate, no ripgrep)
        timeout-minutes: 90
        run: node control/scripts/osir-arm-rescue.mjs regressions
      - name: Original embedded ARM build without signing credentials
        timeout-minutes: 90
        run: node control/scripts/osir-arm-rescue.mjs source-script build
      - name: Original artifact and frozen provenance validation
        id: packaged
        run: node control/scripts/osir-arm-rescue.mjs source-script output
      - name: Original native launch and reopen with isolated data
        timeout-minutes: 5
        env:
          OSIR_ARTIFACT_DIRECTORY: ${{ steps.packaged.outputs.directory }}
        run: node control/scripts/osir-arm-rescue.mjs source-script smoke
      - name: Original frozen source acceptance gate
        run: node control/scripts/osir-arm-rescue.mjs source-script accept
      - name: Archive product and independent producer receipt
        if: always() && steps.packaged.outputs.directory != ''
        id: archive
        env:
          OSIR_ARTIFACT_DIRECTORY: ${{ steps.packaged.outputs.directory }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/osir-ci-prod-arm64-rescue-pending.tar.gz"
          tar -czf "$archive" -C "$OSIR_ARTIFACT_DIRECTORY" . -C "$OSIR_RESCUE_EVIDENCE" producer-receipt.json
          shasum -a 256 "$archive" > "$archive.sha256"
          echo "path=$archive" >> "$GITHUB_OUTPUT"
      - name: Upload native product (inspect receipt before consuming)
        if: always() && steps.archive.outputs.path != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: osir-ci-${{ steps.versions.outputs.version }}-prod-macos-arm64-rescue-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.archive.outputs.path }}
            ${{ steps.archive.outputs.path }}.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Preserve receipt, regression logs and Cargo timings including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: osir-arm-rescue-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.OSIR_RESCUE_EVIDENCE }}/
            source/src-tauri/target/cargo-timings/
          if-no-files-found: warn
          retention-days: 7
      - name: State exact acceptance boundary
        run: |
          echo 'Frozen native ARM release build and original lifecycle gate passed; pending local finalization. Producer workflow identity is separate from frozen source identity. Renderer/native IPC, cross-version update and publication are not covered.' >> "$GITHUB_STEP_SUMMARY"
  macos-arm64-dev:
    if: ${{ inputs.build_kind == 'dev' }}
    runs-on: macos-15
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      CI: 'true'
      OSIR_CHANNEL: dev
      OSIR_DEV_SOURCE_COMMIT: ${{ inputs.source_commit }}
      OSIR_SOURCE_SHA256: ${{ inputs.source_sha256 }}
      OSIR_DEV_SOURCE: ${{ github.workspace }}/source
      OSIR_DEV_EVIDENCE: ${{ github.workspace }}/osir-genuine-dev-evidence
      CARGO_TARGET_DIR: ${{ github.workspace }}/source/src-tauri/target
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
    steps:
      - name: Preserve source LF bytes
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Checkout exact dispatched control
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - name: Checkout unchanged exact product freeze
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_commit }}
          path: source
          persist-credentials: false
      - name: Setup pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: source/.node-version
          package-manager-cache: false
      - name: Verify Dev harness rejection cases
        run: node --test control/scripts/osir-dev-arm.test.mjs
      - name: Assert exact frozen identity and record Dev configuration selection
        run: node control/scripts/osir-dev-arm.mjs init
      - name: Setup pinned pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: source/package.json
          run_install: false
      - name: Install frozen Rust and native ARM target
        run: |
          set -euo pipefail
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustup target add aarch64-apple-darwin --toolchain "$RUSTUP_TOOLCHAIN"
          xcrun --show-sdk-path
      - name: Reuse frozen pnpm download store
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: source/.node-version
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml
      - name: Restore rescue dependency cache without workspace products
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          prefix-key: osir-native-v1
          key: macos-15-arm64-prod
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST ImageOS ImageVersion
          workspaces: source/src-tauri -> target
          cache-bin: false
          cache-workspace-crates: false
          cache-on-failure: true
      - name: Install locked frontend dependencies
        working-directory: source
        run: pnpm install --frozen-lockfile
      - name: Compile actual Dev identity in release profile (single Cargo worker)
        id: built
        timeout-minutes: 90
        run: node control/scripts/osir-dev-arm.mjs build
      - name: Validate native Dev window, reopen, isolated DB and configured proxy port
        timeout-minutes: 5
        run: node control/scripts/osir-dev-arm.mjs smoke
      - name: Archive Dev application and honest evidence scope
        if: always() && steps.built.outputs.directory != ''
        id: archive
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/osir-genuine-dev-arm-acceptance-only.tar.gz"
          tar -czf "$archive" -C "$OSIR_DEV_EVIDENCE" .
          shasum -a 256 "$archive" > "$archive.sha256"
          echo "path=$archive" >> "$GITHUB_OUTPUT"
      - name: Upload Dev package for isolated binding E2E
        if: always() && steps.archive.outputs.path != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: osir-genuine-dev-arm-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.archive.outputs.path }}
            ${{ steps.archive.outputs.path }}.sha256
          retention-days: 3
          if-no-files-found: error
          compression-level: 0
      - name: Preserve small Dev diagnostics on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: osir-genuine-dev-arm-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.OSIR_DEV_EVIDENCE }}/*.json
            ${{ env.OSIR_DEV_EVIDENCE }}/*.log
            ${{ env.OSIR_DEV_EVIDENCE }}/*.plist
          retention-days: 3
          if-no-files-found: warn
      - name: State Dev-only acceptance boundary
        run: |
          echo 'Genuine compiled com.osir.client.dev ARM package; embedded renderer, native window/reopen and isolated database configured for 127.0.0.1:15724. Actual proxy traffic, binding E2E and cross-version update remain not-run. Acceptance-only ad-hoc Dev package, not a production release.' >> "$GITHUB_STEP_SUMMARY"
